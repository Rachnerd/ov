<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenValue — Tech Tribes</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { margin: 0; background: var(--color-bg-canvas); }

    .scroll-btn-wrap {
      display: flex;
      justify-content: center;
      padding: var(--ov-space-8) 0 0;
    }
    .scroll-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--color-brand);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      transition: background-color var(--ov-duration-fast), transform var(--ov-duration-fast);
    }
    .scroll-btn:hover {
      background: var(--color-brand-hover);
      transform: translateY(2px);
    }

    /* ── Responsive logo ── */
    @media (max-width: 639px) {
      ov-hero    ov-logo { --ov-logo-height: 64px; }
    }

    .intro {
      /* max-width: 820px; */
      margin: 0 auto;
      /* padding: var(--ov-space-12) var(--ov-space-8) var(--ov-space-16); */
      text-align: center;
    }
  </style>
</head>

<body data-theme="light">

  <ov-page-layout>

    <ov-nav-bar slot="nav" logo-href="/" active="/">
      <ov-logo slot="logo" size="sm"></ov-logo>
      <ov-button slot="actions" variant="primary" size="sm">Contact</ov-button>
    </ov-nav-bar>

    <ov-hero slot="hero" src="/banner.jpg" overlay="0.68" subheading="">
      <ov-logo slot="logo" size="xl"></ov-logo>
    </ov-hero>

    <div class="scroll-btn-wrap">
      <button type="button" class="scroll-btn" id="scroll-btn" aria-label="Scroll to content">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M5.5 8.5l5.5 5.5 5.5-5.5"
                stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <section class="intro" id="intro">
      <ov-text variant="lead" weight="bold" as="p">
        Over 200 seasoned full stack Java experts, Java champions &amp; JavaOne rockstars.
        We love to work with the latest open source technology and share what we've learned.
      </ov-text>
    </section>

    <ov-carousel heading="Our offices in 8 cities">
      <ov-text slot="description" variant="body" as="p">
        Present throughout the Netherlands — always close to you.
        <ov-link href="/contact">Contact us</ov-link>.
      </ov-text>
      <ov-image-card label="OpenValue Amsterdam"  src="/amsterdam.jpg"  href="#"></ov-image-card>
      <ov-image-card label="OpenValue Arnhem"     src="/arnhem.jpg"     href="#"></ov-image-card>
      <ov-image-card label="OpenValue Düsseldorf" src="/dusseldorf.jpg" href="#"></ov-image-card>
      <ov-image-card label="OpenValue Munich" src="/munich.jpg" href="#"></ov-image-card>
      <ov-image-card label="OpenValue Rotterdam" src="/rotterdam.jpg" href="#"></ov-image-card>
      <ov-image-card label="OpenValue Utrecht" src="/utrecht.jpg" href="#"></ov-image-card>
      <ov-image-card label="OpenValue Vienna" src="/vienna.jpg" href="#"></ov-image-card>
      <ov-image-card label="OpenValue Zurich" src="/zurich.jpg" href="#"></ov-image-card>
      <ov-image-card label="OpenValue Amsterdam"  src="/amsterdam.jpg"  href="#"></ov-image-card>
      <ov-image-card label="OpenValue Arnhem"     src="/arnhem.jpg"     href="#"></ov-image-card>

    </ov-carousel>

  </ov-page-layout>

  <script type="module" src="/main.ts"></script>

  <script type="module">
    document.querySelector('ov-nav-bar').items = [
      { label: 'Home',          href: '/' },
      { label: 'Services',      href: '/services.html' },
      { label: 'Projects',      href: '/projects.html' },
      { label: 'Training',      href: '/training.html' },
      { label: 'Career',        href: '/career.html' },
      { label: 'Speakers',      href: '/speakers.html' },
      { label: 'Tech Insights', href: '/tech-insights.html' },
      { label: 'About',         href: '/about.html' },
    ];

    document.getElementById('scroll-btn').addEventListener('click', () => {
      document.getElementById('intro').scrollIntoView({ behavior: 'smooth' });
    });
  </script>

</body>
</html>
