<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenValue — Sign in</title>
  <style>
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: var(--color-bg-canvas);
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: var(--ov-space-8);
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--ov-radius-xl);
      box-shadow: var(--shadow-md);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: var(--ov-space-2);
      margin-bottom: var(--ov-space-6);
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: var(--color-brand);
      border-radius: var(--ov-radius-md);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .fields {
      display: flex;
      flex-direction: column;
      gap: var(--ov-space-4);
      margin-top: var(--ov-space-6);
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: var(--ov-space-3);
      margin-top: var(--ov-space-6);
    }

.footer {
      margin-top: var(--ov-space-6);
      text-align: center;
    }
  </style>
</head>

<body>
  <main>
    <div class="card">

      <div class="logo">
        <div class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M9 3l6 10.5H3L9 3z" fill="white" opacity="0.9"/>
          </svg>
        </div>
        <ov-text variant="eyebrow" tone="brand">OpenValue</ov-text>
      </div>

      <ov-heading level="2" size="h2">Welcome back</ov-heading>
      <ov-text variant="body-sm" tone="secondary" as="p" style="margin-top: var(--ov-space-1)">
        Sign in to your account to continue
      </ov-text>

      <form class="fields" novalidate>

        <ov-field label="Email" for="email" required>
          <ov-input
            id="email"
            type="email"
            placeholder="you@company.com"
            name="email"
            autocomplete="email"
          >
            <ov-icon slot="prefix" name="mail"></ov-icon>
          </ov-input>
        </ov-field>

        <ov-field label="Password" for="password" required>
          <ov-input
            id="password"
            type="password"
            placeholder="••••••••"
            name="password"
            autocomplete="current-password"
          >
            <ov-icon slot="prefix">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <rect x="3" y="7" width="10" height="8" rx="1.5"/>
                <path d="M5 7V5a3 3 0 0 1 6 0v2"/>
              </svg>
            </ov-icon>
          </ov-input>
        </ov-field>

        <div class="remember-row">
          <ov-checkbox name="remember" value="true">Remember me</ov-checkbox>
          <ov-link href="/forgot-password" variant="brand" size="sm">Forgot password?</ov-link>
        </div>

        <div class="actions">
          <ov-button type="submit" variant="primary" block>Sign in</ov-button>

          <ov-divider>or</ov-divider>

          <ov-button type="button" variant="secondary" block>
            <svg slot="start" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M15.5 8.17c0-.57-.05-1.12-.14-1.64H8v3.1h4.2a3.6 3.6 0 0 1-1.56 2.36v1.96h2.52c1.47-1.36 2.34-3.36 2.34-5.78z" fill="#4285F4"/>
              <path d="M8 16c2.1 0 3.87-.7 5.16-1.89l-2.52-1.96c-.7.47-1.6.75-2.64.75-2.03 0-3.75-1.37-4.36-3.22H1.04v2.02A8 8 0 0 0 8 16z" fill="#34A853"/>
              <path d="M3.64 9.68A4.8 4.8 0 0 1 3.39 8c0-.59.1-1.16.25-1.68V4.3H1.04A8 8 0 0 0 0 8c0 1.29.31 2.51.85 3.58l2.64-1.9z" fill="#FBBC05"/>
              <path d="M8 3.18c1.14 0 2.17.39 2.98 1.16l2.23-2.23A8 8 0 0 0 8 0 8 8 0 0 0 1.04 4.3l2.6 2.02C4.25 4.55 5.97 3.18 8 3.18z" fill="#EA4335"/>
            </svg>
            Continue with Google
          </ov-button>
        </div>

      </form>

      <div class="footer">
        <ov-text variant="body-sm" tone="secondary">
          Don't have an account?
          <ov-link href="/register" variant="brand" underline="always">Create one free</ov-link>
        </ov-text>
      </div>

    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
